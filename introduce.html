<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
      width: 100%;
      max-width: 750px;
      margin: 0 auto;
      text-align: center;
      background-color: #141414;
      color: #ffffff;
    }
    img {
      width: 350px;
      height: 450px;
    }
    table {
      width: 100%;      
      border-collapse: collapse; 
      margin-top: 20px;
    }
    table, tr, th, td {
      border: 1px solid white;
      box-sizing: border-box;
      padding: 10px;
    }
    th {
      background-color: white;
      border-color: black;
      border-bottom: 0.1px solid black;
      box-sizing: border-box;
      color: black;
      
    }
    button {
      background-color: black;
      border-radius: 10px;
      color: white;
      font-size: 1.2rem;
      font-weight: bold;
    }
    #btn1 {
      display: flex;
      flex-direction: row;
      justify-content: space-around;
    }
    a {
      text-decoration: none;
      color: red;
    }
    .images-container {
      display: flex;
      justify-content: space-around; 
      gap: 10px;
    }
    .images-container img {
      width: 250px;
      height: 400px;
    }
    #content img {
      display: block;
      margin: 0 auto; 
      width: 250px;   
      height: 380px;
    }
    
  </style>
</head>
<body>
  <h1><a href="introduce.html">한국 명작 영화 3편</a></h1>
  <hr>
  <div id="btn1">
    <button type="button"  name="1">베테랑 상세설명</button>
    <button type="button"  name="2">완벽한타인 상세설명</button>
    <button type="button"  name="3">곤지암 상세설명</button>
  </div>
  <hr>
  <div id="content">
    <div class="images-container">
      <img src="img/veteran.jpg">
      <img src="img/strangers.jpg">
      <img src="img/gonjiam.jpg">
    </div>
  </div>

  <script>
    const btn1 = document.querySelector("#btn1");
    const xhttp = new XMLHttpRequest();
        
    btn1.addEventListener('click', loadDoc);
    
    function loadDoc(e){
      if(e.target.name === `1`){
        xhttp.open("GET", "movie_info1.txt");
      }
      if(e.target.name === `2`){
        xhttp.open("GET", "movie_info2.txt");
      }
      if(e.target.name === `3`){
        xhttp.open("GET", "movie_info3.txt");
      }
       
      xhttp.onload = function(){
        document.getElementById("content").innerHTML = xhttp.responseText;
      };
      xhttp.send();
    
    }

  </script>
</body>
</html>
