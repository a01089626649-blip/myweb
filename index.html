<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .box {
      width: 900px;
      margin: 0 auto;
    }
    header {
      height: 130px;
      background-color: #f5f5f5;
      border-bottom: 1px solid #ddd;
    }
    .box1, .top {
      display: flex;
      justify-content: space-between;
      height: 100%;
      align-items: center;
    }
    .main {
      font-size: 2rem;
      font-weight: bold;
      text-decoration: none;
      color: black;
    }
    .log a {
      gap: 25px;
      text-decoration: none;
      color: black;
      font-weight: bold;
    }
    #font {
      font-size: 25px;
      margin-left: 15px;
    }
    /* -------------------------------------- */
    /* 신규 추가: 중앙 상단 파일 열기 버튼 스타일 */
    /* -------------------------------------- */
    .header-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .file-btn {
      display: inline-block;
      font-weight: bold;
      text-decoration: none;
      background-color: #007aff; /* 눈에 띄는 파란색 포인트 */
      color: white;
      border-radius: 15px;
      padding: 8px 16px;
      font-size: 14px;
      transition: background-color 0.2s;
    }
    .file-btn:hover {
      background-color: #0056b3; /* 마우스 올렸을 때 어두워짐 */
    }
    /* -------------------------------------- */
    .menu-wrap {
      margin-right: 20px;
    }
    .menu {
      display: inline-block;
      font-weight: bold;
      text-decoration: none;
      background-color: black;
      color: white;
      border-radius: 15px;
      padding: 12px 24px;
    }
    #image {
      width: 550px;
      height: 500px;
      margin-top: 20px;
      float: left;
      object-fit: cover;
    }
    #content {
      margin-top: 100px;
      margin-right: 40px;
      width: 300px;
      float: right;
    }
    #content p {
      font-size: 20px;
    }
   
  </style>
</head>
<body>
  <div class="top box">
    <a href="index.html" class="main">Samsung</a>
    <div class="log">
      <a href="#" class="top-menu">로그인</a>
      <a href="#" class="top-menu">회원가입</a>
      <a href="#" class="top-menu">고객센터</a>
    </div>
  </div>
  
  <header>
    <div class="box box1">
      <!-- 정렬을 위해 타이틀과 버튼을 .header-left 마크업으로 묶었습니다 -->
      <div class="header-left">
        <h1>이달의 신상!!<span id="font">갤럭시 Z폴드8울트라</span></h1>
        <!-- 파일 열기 버튼 (새 탭에서 열리도록 target="_blank" 처리) -->
        <a href="document.pdf" target="_blank" class="file-btn">📄 기획서 열기</a>
      </div>
      <div class="menu-wrap">
        <a href="menu.html" class="menu">전체상품</a>
      </div>
    </div>
  </header>

  <main>
    <div class="box">
      <img src="css/images/zfold8ultra.jpg" id="image">
      <div id="content">
        <h2>"폴더블의 한계를 깨다."</h2><p>여권만큼 작게 접히고, 책처럼 넓게<br> 펼쳐집니다.역대 가장 가벼운 201g의무게에 담아낸 완전히 새로운 4:3 대화면.
            주머니에 쏙 들어가는 태블릿,갤럭시 Z 폴드8을 지금 가장 먼저 만나보세요.</p>
      </div>
    </div>
  </main>
  <footer>
    
  </footer>
</body>
</html>
