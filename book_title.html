<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>미운아기오리</title>
  <style>
    /* 화면 전체 기본 세팅 */
    body {
      width: 100%;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      background-color: #ededf0; /* 전체 바깥 배경은 어둡게 */
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ★ 핵심 1: 화면 전체가 아니라 이 800px 상자가 '책 표지'이자 절대 기준점이 됩니다 ★ */
    .first-page {
      width: 800px;
      height: 700px; /* 표지 형태를 구성하기 위해 세로 높이를 시원하게 부여 */
      background-image: url(img/duck.jpg);/* 눈으로 확인하기 쉽게 표지 전용 배경색 부여 */
      background-repeat: no-repeat;
      background-size: cover;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      position: relative; /* ◀ 이 선언 덕분에 내부 absolute 요소들이 이 상자를 기준으로 움직입니다 */
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
       
    header h1 {
      color: #ffffff;
      font-size: 2.5rem;
      margin: 0;
    }

    /* ★ 핵심 3: 버튼을 책 표지의 '우측 하단' 구석자리에 고정 ★ */
    .btn {
      position: absolute;
      top: 45%;      /* 표지 밑바닥 벽에서 40px 위로 */
      right: 22%;       /* 표지 오른쪽 벽에서 40px 안쪽으로 */
    }

    /* 책 읽기 링크 버튼 스타일 마감 */
    .btn a {
      display: inline-block;
      border: 1px solid black;
      border-radius: 20px;
      color: black;
      text-decoration: none;
      padding: 10px 24px;
      font-weight: bold;
      transition: background-color 0.2s;
    }
    .btn a:hover {
      background-color: black;
      color: white;
    }

  </style>
</head>
<body>

  <!-- 가상의 책 표지 레이아웃 (모든 내부 좌표의 우주 기준점) -->
  <div class="first-page">
  </div>
  <div class="btn">
     <a href="book_page1.html">책 읽기</a>
  </div>
</body>
</html>
